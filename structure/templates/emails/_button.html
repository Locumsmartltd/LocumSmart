{% comment %}Primary call to action. Usage: {% include "emails/_button.html" with url=... label=... %}{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0;">
  <tr>
    <td align="center" bgcolor="#1BA39C" style="border-radius:8px;">
      <a href="{{ url }}" style="display:inline-block; padding:14px 30px; font-family:Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; color:#FFFFFF; text-decoration:none; border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
