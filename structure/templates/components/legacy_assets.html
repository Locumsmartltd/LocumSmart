<!-- Legacy Bootstrap/jQuery bundle for pages not yet migrated to the redesign system.
     Restores what the old base.html used to load globally, scoped now to only the
     pages that still need it (admin panel + a few account-flow pages). -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  .messages { margin-bottom: 20px; }
  .alert { padding: 10px; margin-bottom: 10px; }
  .alert-success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
  .alert-error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<script src="https://cdn.rawgit.com/dubrox/Multiple-Dates-Picker-for-jQuery-UI/master/jquery-ui.multidatespicker.js"></script>
<style>
  /* Bootstrap 4's own :root palette (--teal, --blue, --red, etc.) uses the same
     custom-property names as our redesign tokens and loads after them, silently
     overriding our brand colors (e.g. Bootstrap's --teal: #20c997 vs ours: #1BA39C)
     on every page that includes this bundle. Reassert our values so shared
     components (navbar, buttons) keep the correct brand colors here too. */
  :root {
    --teal: #1BA39C; --teal-dark: #148982; --teal-darker: #0F6B66;
    --mint: #B3E5DB; --mint-light: #E7F6F3;
    --blue: #5B8FD8; --coral: #FF6B6B; --red: #E74C3C;
    --charcoal: #2A2F36; --grey: #5A6472; --grey-light: #9AA3B0;
  }
</style>
