{% load static %}
<header>
  <div class="container">
    <nav class="nav">
      <a href="{% url 'LandingPage' %}" class="logo">
        <span class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M14 4H10C9.45 4 9 4.45 9 5V9H5C4.45 9 4 9.45 4 10V14C4 14.55 4.45 15 5 15H9V19C9 19.55 9.45 20 10 20H14C14.55 20 15 19.55 15 19V15H19C19.55 15 20 14.55 20 14V10C20 9.45 19.55 9 19 9H15V5C15 4.45 14.55 4 14 4Z" fill="white"/>
            <circle cx="17.5" cy="6.5" r="2.5" fill="#E74C3C"/>
          </svg>
        </span>
        <span class="logo-text">Locum<span>Smart</span></span>
      </a>
      <div class="nav-links">
        <a href="{% url 'for_pharmacists' %}"{% if request.resolver_match.url_name == 'for_pharmacists' %} class="active"{% endif %}>For Pharmacy</a>
        <a href="{% url 'primary_care' %}"{% if request.resolver_match.url_name == 'primary_care' %} class="active"{% endif %}>Primary Care</a>
        <a href="{% url 'register' %}"{% if request.resolver_match.url_name == 'register' %} class="active"{% endif %}>Register</a>
        <a href="{% url 'locumjobs' %}"{% if request.resolver_match.url_name == 'locumjobs' %} class="active"{% endif %}>Jobs</a>
        <a href="{% url 'aboutus' %}"{% if request.resolver_match.url_name == 'aboutus' %} class="active"{% endif %}>About</a>
        {% if user.is_authenticated %}
          {% if user.admin %}
            <a href="{% url 'admin' %}">Profile</a>
          {% else %}
            <a href="{% url 'locumProfile' %}">Profile</a>
          {% endif %}
          <a href="{% url 'logout' %}">Log out</a>
        {% else %}
          <a href="{% url 'login' %}"{% if request.resolver_match.url_name == 'login' %} class="active"{% endif %}>Log in</a>
        {% endif %}
        <a href="{% url 'employerrequest' %}" class="btn btn-primary" style="margin-left: 8px;">Book a Call</a>
      </div>
    </nav>
  </div>
</header>
